name: mordakte
description: "Mordakte – kooperatives 2.5D-Murder-Mystery."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  intl: ^0.20.3
  mordakte_core:
    path: packages/mordakte_core
  burgstadt_core:
    path: packages/burgstadt_core
  burgstadt_spiel:
    path: packages/burgstadt_spiel
  room_host:
    path: packages/room_host
  pixel_engine:
    path: packages/pixel_engine
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  web_socket_channel: ^3.0.3
  audioplayers: ^6.8.1
  gamepads: ^0.1.12

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - content/scenarios/
    - assets/burgstadt/ton/
    - krimidinner/spuk-im-gewoelbe/10_kanon/
    - nachtlauf/kanon/ANPASSUNG.md
    - packages/pixel_engine/data/figuren/
    - packages/burgstadt_core/data/innenraeume/
    - packages/burgstadt_core/data/stadt/haeuser.json
    - packages/burgstadt_core/data/stadt/bewohner.json
    - packages/burgstadt_core/data/rollen/faehigkeiten.json
    - packages/burgstadt_spiel/data/texte/
    - content/party/schlosskeller/
    - content/party/schlosskeller/tatmatrix/
    - content/party/schlosskeller/texte/
  fonts:
    - family: SpecialElite
      fonts:
        - asset: assets/fonts/SpecialElite-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
