name: mordakte
description: "Mordakte – kooperatives 2.5D-Murder-Mystery."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flame: ^1.38.2
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  go_router: ^18.0.2
  intl: ^0.20.3
  mordakte_core:
    path: packages/mordakte_core
  burgstadt_core:
    path: packages/burgstadt_core
  burgstadt_spiel:
    path: packages/burgstadt_spiel
  pixel_engine:
    path: packages/pixel_engine
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  web_socket_channel: ^3.0.3

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - content/scenarios/
  fonts:
    - family: SpecialElite
      fonts:
        - asset: assets/fonts/SpecialElite-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
